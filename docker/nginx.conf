server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service.
    # BACKEND_URL env var is substituted at container start via envsubst.
    # Railway: set BACKEND_URL=http://backend.railway.internal:8000
    # Docker Compose: set BACKEND_URL=http://backend:8000
    location /api {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass ${BACKEND_URL};
    }
}
